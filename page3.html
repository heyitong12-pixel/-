<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测试页 3 - 表单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:linear-gradient(135deg,#eaf2ff 0%,#f5e9ff 100%);padding:20px;min-height:100vh}
.nav{max-width:1000px;margin:0 auto 20px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:8px;padding:12px 16px}
.nav a{text-decoration:none;color:#555;font-size:13px;padding:6px 14px;border-radius:6px}
.nav a:hover{background:#f5f5f5}
.nav a.active{background:#1677ff;color:#fff;font-weight:500}
.nav .brand{font-weight:600;color:#1677ff;margin-right:auto;font-size:14px}
.page{max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h1{font-size:18px;color:#333;margin-bottom:6px}
.desc{font-size:13px;color:#888;margin-bottom:16px}
.form{display:flex;flex-direction:column;gap:14px;max-width:480px}
.row{display:flex;flex-direction:column;gap:6px}
.row label{font-size:13px;color:#555}
.row input,.row select{padding:8px 12px;border:1px solid #e0e0e0;border-radius:6px;font-size:13px;outline:none}
.row input:focus,.row select:focus{border-color:#1677ff}
.btn{width:fit-content;padding:8px 24px;border:none;border-radius:6px;background:#1677ff;color:#fff;font-size:13px;cursor:pointer}
.btn:hover{background:#0f66d6}
#tip{font-size:13px;color:#1a9c52;margin-top:4px}
.back{display:inline-block;margin-top:20px;font-size:13px;color:#1677ff;text-decoration:none}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="nav">
  <span class="brand">跳转测试</span>
  <a href="index.html">首页</a>
  <a href="page1.html">表格</a>
  <a href="page2.html">卡片</a>
  <a href="page3.html" class="active">表单</a>
</div>
<div class="page">
  <div class="card">
    <h1>测试页 3：表单</h1>
    <p class="desc">演示表单交互（提交后仅本地提示，点击导航可切换到其他页面）</p>
    <div class="form">
      <div class="row"><label>设备名称</label><input id="name" placeholder="请输入设备名称"></div>
      <div class="row"><label>设备类型</label>
        <select id="type"><option>Gateway</option><option>ESL</option><option>Cloud Node</option></select>
      </div>
      <div class="row"><label>备注</label><input id="note" placeholder="选填"></div>
      <button class="btn" onclick="submit()">提交</button>
      <div id="tip"></div>
    </div>
  </div>
  <a class="back" href="index.html">← 返回文件库首页</a>
</div>
<script>
function submit(){
  var n=document.getElementById('name').value||'未命名设备';
  var t=document.getElementById('type').value;
  document.getElementById('tip').textContent='✓ 已提交：'+n+'（'+t+'）';
}
</script>
</body>
</html>
