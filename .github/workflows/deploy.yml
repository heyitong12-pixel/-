name: Deploy to GitHub Pages

on:
  workflow_dispatch: # 仅手动触发一次，启用 Pages 后 GitHub 会自动部署 main 分支

permissions:
  contents: write      # 读取仓库内容 + Pages 站点元数据
  pages: write         # Pages 写权限
  administration: write # 启用/禁用 Pages 站点需要仓库管理权限

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      # 检查/启用 GitHub Pages（classic，source = main 分支根目录）
      # 启用后 GitHub 会自动监听 main 分支的变更并部署，无需额外 action
      - name: Enable GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.info(`Pages 已启用，source: ${JSON.stringify(data.source)}`);
            } catch (e) {
              if (e.status === 404) {
                await github.rest.repos.createPagesSite({
                  owner, repo,
                  source: { branch: 'main', path: '/' }
                });
                core.info('GitHub Pages 已启用（source: main 分支根目录），GitHub 会自动部署。');
              } else {
                core.setFailed(`启用 Pages 失败: ${e.message}`);
              }
            }