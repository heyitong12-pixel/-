<!DOCTYPE html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测试页 2 - 卡片列表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:linear-gradient(135deg,#eaf2ff 0%,#f5e9ff 100%);padding:20px;min-height:100vh}
.nav{max-width:1000px;margin:0 auto 20px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:8px;padding:12px 16px}
.nav a{text-decoration:none;color:#555;font-size:13px;padding:6px 14px;border-radius:6px}
.nav a:hover{background:#f5f5f5}

.desc{font-size:13px;color:#888;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.item{border:1px solid #eee;border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.item:hover{box-shadow:0 4px 12px rgba(22,119,255,.15);transform:translateY(-2px)}
.item .icon{width:52px;height:60px;margin:0 auto 10px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:bold}
.item .name{font-size:12px;color:#333;word-break:break-all}
.pdf{background:#e74c3c}.doc{background:#2b579a}.xls{background:#217346}.img{background:#f39c12}.zip{background:#7f8c8d}
.back{display:inline-block;margin-top:20px;font-size:13px;color:#1677ff;text-decoration:none}
.back:hover{text-decoration:underline}
